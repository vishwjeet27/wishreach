<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140626"/>
      <stop offset="60%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="headGrad2" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg2)"/>
  <circle cx="256" cy="200" r="160" fill="#A855F7" opacity="0.14" filter="url(#glow)"/>

  
    <!-- Top accessories (antenna, hat, etc behind or on top) -->
    
      <!-- Headphone Arch -->
      <path d="M140 260 C140 120 372 120 372 260" stroke="#1E1B4B" stroke-width="26" stroke-linecap="round" fill="none" />
      <path d="M160 230 C160 140 352 140 352 230" stroke="#3B0764" stroke-width="12" stroke-linecap="round" fill="none" />
      <!-- Headphone comfort cushion -->
      <path d="M200 150 Q256 138 312 150" stroke="#581C87" stroke-width="18" stroke-linecap="round" fill="none"/>
    

    <!-- Ears -->
    <ellipse cx="140" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="140" cy="270" rx="16" ry="18" fill="#CBD5E1" />
    <ellipse cx="372" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="372" cy="270" rx="16" ry="18" fill="#CBD5E1" />

    <!-- Torso / Shoulders -->
    
      <path d="M120 480 Q140 370 200 360 L312 360 Q372 370 392 480 Z" fill="#2E1065" />
      <path d="M190 360 L256 430 L322 360 L345 480 L167 480 Z" fill="#3B0764" />
      <!-- Zipper -->
      <line x1="256" y1="430" x2="256" y2="480" stroke="#C084FC" stroke-width="4"/>
    

    <!-- Neck & Chin Shadow -->
    <path d="M220 330 Q256 350 292 330 L296 380 Q256 395 216 380 Z" fill="#C084FC" />

    <!-- Head -->
    <ellipse cx="256" cy="260" rx="116" ry="108" fill="url(#headGrad2)" filter="url(#dropShadow)" />
    <!-- Subtle specular highlight on forehead -->
    <ellipse cx="256" cy="185" rx="60" ry="24" fill="white" opacity="0.18" />

    <!-- Head Accessories (hat, hair, etc) -->
    

    <!-- Face Elements (eyes, glasses, smile) -->
    
      <!-- Large Over-ear Earcups -->
      <g filter="url(#dropShadow)">
        <rect x="110" y="215" width="46" height="96" rx="23" fill="#1E1B4B" stroke="#A855F7" stroke-width="5"/>
        <circle cx="133" cy="263" r="14" fill="#581C87" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>

        <rect x="356" y="215" width="46" height="96" rx="23" fill="#1E1B4B" stroke="#A855F7" stroke-width="5"/>
        <circle cx="379" cy="263" r="14" fill="#581C87" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
      </g>

      <!-- Eyes & Wink -->
      <!-- Left Eye: Cool Wink -->
      <path d="M200 248 Q216 260 232 248" stroke="#3B0764" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Right Eye: Big expressive pupil with sparkle -->
      <ellipse cx="288" cy="248" rx="14" ry="18" fill="#1E1B4B" />
      <circle cx="284" cy="242" r="5" fill="#FFFFFF"/>
      <circle cx="292" cy="254" r="2.5" fill="#FFFFFF"/>

      <!-- Friendly Smile -->
      <path d="M232 305 Q256 325 280 305" stroke="#3B0764" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Rosy cheeks -->
      <circle cx="188" cy="280" r="14" fill="#F472B6" opacity="0.35"/>
      <circle cx="324" cy="280" r="14" fill="#F472B6" opacity="0.35"/>
    
  
</svg>