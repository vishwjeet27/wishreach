<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C14"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <radialGradient id="headGrad3" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </radialGradient>
    <linearGradient id="vrGoggles" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg3)"/>
  <circle cx="256" cy="200" r="160" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  
    <!-- Top accessories (antenna, hat, etc behind or on top) -->
    
      <!-- Modern Diamond Antenna -->
      <path d="M256 160 L256 110" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
      <polygon points="256,92 272,110 256,128 240,110" fill="#10B981" filter="url(#glow)"/>
      <polygon points="256,98 266,110 256,122 246,110" fill="#FFFFFF"/>
    

    <!-- Ears -->
    <ellipse cx="140" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="140" cy="270" rx="16" ry="18" fill="#CBD5E1" />
    <ellipse cx="372" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="372" cy="270" rx="16" ry="18" fill="#CBD5E1" />

    <!-- Torso / Shoulders -->
    
      <path d="M120 480 Q140 370 200 360 L312 360 Q372 370 392 480 Z" fill="#064E3B" />
      <path d="M190 360 L256 420 L322 360 L345 480 L167 480 Z" fill="#047857" />
      <circle cx="256" cy="450" r="12" fill="#10B981" opacity="0.8" filter="url(#glow)"/>
    

    <!-- Neck & Chin Shadow -->
    <path d="M220 330 Q256 350 292 330 L296 380 Q256 395 216 380 Z" fill="#6EE7B7" />

    <!-- Head -->
    <ellipse cx="256" cy="260" rx="116" ry="108" fill="url(#headGrad3)" filter="url(#dropShadow)" />
    <!-- Subtle specular highlight on forehead -->
    <ellipse cx="256" cy="185" rx="60" ry="24" fill="white" opacity="0.18" />

    <!-- Head Accessories (hat, hair, etc) -->
    

    <!-- Face Elements (eyes, glasses, smile) -->
    
      <!-- VR Headset -->
      <g filter="url(#dropShadow)">
        <!-- Headset strap -->
        <path d="M140 248 C140 248 190 230 256 230 C322 230 372 248 372 248" stroke="#0F172A" stroke-width="16" fill="none"/>
        <!-- Main Goggle body -->
        <rect x="160" y="220" width="192" height="64" rx="24" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
        <rect x="172" y="228" width="168" height="48" rx="16" fill="url(#vrGoggles)"/>
        <!-- Glowing sensor bar -->
        <line x1="200" y1="252" x2="312" y2="252" stroke="#A7F3D0" stroke-width="3" filter="url(#glow)"/>
        <!-- Glass Specular Reflection -->
        <path d="M185 232 L225 232 L205 272 L175 272 Z" fill="#FFFFFF" opacity="0.35"/>
      </g>
      <!-- Confident calm mouth -->
      <path d="M236 315 Q256 325 276 315" stroke="#064E3B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
  
</svg>