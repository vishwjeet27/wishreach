<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1004"/>
      <stop offset="50%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="headGrad4" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg4)"/>
  <circle cx="256" cy="200" r="160" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>

  
    <!-- Top accessories (antenna, hat, etc behind or on top) -->
    

    <!-- Ears -->
    <ellipse cx="140" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="140" cy="270" rx="16" ry="18" fill="#CBD5E1" />
    <ellipse cx="372" cy="270" rx="28" ry="32" fill="#E2E8F0" />
    <ellipse cx="372" cy="270" rx="16" ry="18" fill="#CBD5E1" />

    <!-- Torso / Shoulders -->
    
      <path d="M120 480 Q140 370 200 360 L312 360 Q372 370 392 480 Z" fill="#1F2937" />
      <path d="M190 360 L256 420 L322 360 L345 480 L167 480 Z" fill="#111827" />
      <!-- Gold Chain -->
      <path d="M210 370 Q256 450 302 370" stroke="#F59E0B" stroke-width="5" fill="none" filter="url(#glow)"/>
      <circle cx="256" cy="435" r="10" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
    

    <!-- Neck & Chin Shadow -->
    <path d="M220 330 Q256 350 292 330 L296 380 Q256 395 216 380 Z" fill="#FCD34D" />

    <!-- Head -->
    <ellipse cx="256" cy="260" rx="116" ry="108" fill="url(#headGrad4)" filter="url(#dropShadow)" />
    <!-- Subtle specular highlight on forehead -->
    <ellipse cx="256" cy="185" rx="60" ry="24" fill="white" opacity="0.18" />

    <!-- Head Accessories (hat, hair, etc) -->
    
      <!-- Backward Snapback Cap -->
      <g filter="url(#dropShadow)">
        <!-- Cap visor pointing backward/right -->
        <path d="M220 160 Q270 140 370 175 Q350 205 290 190 Z" fill="#B45309"/>
        <!-- Cap Crown -->
        <path d="M152 230 C152 145 360 145 360 230 C330 200 180 200 152 230 Z" fill="url(#goldCap)" stroke="#78350F" stroke-width="4"/>
        <!-- Front metal emblem / eyelet -->
        <circle cx="256" cy="188" r="8" fill="#78350F"/>
        <circle cx="256" cy="188" r="4" fill="#FDE68A"/>
      </g>
    

    <!-- Face Elements (eyes, glasses, smile) -->
    
      <!-- Cool Wayfarer Dark Sunglasses -->
      <g filter="url(#dropShadow)">
        <!-- Left Lens -->
        <rect x="180" y="235" width="64" height="42" rx="12" fill="#111827" stroke="#1F2937" stroke-width="3"/>
        <path d="M188 240 L210 240 L195 272 L186 272 Z" fill="#F59E0B" opacity="0.35"/>
        <!-- Right Lens -->
        <rect x="268" y="235" width="64" height="42" rx="12" fill="#111827" stroke="#1F2937" stroke-width="3"/>
        <path d="M276 240 L298 240 L283 272 L274 272 Z" fill="#F59E0B" opacity="0.35"/>
        <!-- Bridge -->
        <rect x="242" y="244" width="28" height="6" rx="3" fill="#1F2937"/>
      </g>
      <!-- Grin -->
      <path d="M232 308 Q256 328 280 308" stroke="#78350F" stroke-width="5" stroke-linecap="round" fill="none"/>
    
  
</svg>