<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="goldVisor" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg5)"/>

  <!-- Twinkling background stars -->
  <circle cx="80" cy="90" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="430" cy="110" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="120" cy="220" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="410" cy="320" r="2" fill="#FDE047" opacity="0.7"/>
  <circle cx="70" cy="380" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="256" cy="180" r="180" fill="#38BDF8" opacity="0.1" filter="url(#glow)"/>

  <!-- Astronaut Torso -->
  <path d="M110 480 Q130 360 200 350 L312 350 Q382 360 402 480 Z" fill="url(#suitGrad)" filter="url(#dropShadow)"/>
  <!-- Space Suit Chest Plate -->
  <rect x="200" y="375" width="112" height="90" rx="16" fill="#334155" />
  <circle cx="230" cy="410" r="8" fill="#EF4444" />
  <circle cx="256" cy="410" r="8" fill="#3B82F6" />
  <circle cx="282" cy="410" r="8" fill="#10B981" />
  <!-- Space agency mission patch -->
  <polygon points="256,432 268,452 244,452" fill="#F59E0B" />

  <!-- Helmet Collar -->
  <ellipse cx="256" cy="340" rx="90" ry="26" fill="#64748B" filter="url(#dropShadow)" />
  <ellipse cx="256" cy="336" rx="84" ry="22" fill="#94A3B8" />

  <!-- Helmet Bubble Dome -->
  <circle cx="256" cy="240" r="130" fill="url(#suitGrad)" filter="url(#dropShadow)" />
  <!-- Helmet trim seam -->
  <circle cx="256" cy="240" r="126" stroke="#94A3B8" stroke-width="5" fill="none"/>

  <!-- Gold Reflective Visor -->
  <ellipse cx="256" cy="245" rx="100" ry="85" fill="url(#goldVisor)" stroke="#475569" stroke-width="6"/>

  <!-- Visor Curved Specular Highlights (Planet / Earth curvature reflection) -->
  <path d="M190 195 Q256 175 322 195 Q290 220 220 220 Z" fill="#FFFFFF" opacity="0.45" />
  <circle cx="205" cy="245" r="14" fill="#FFFFFF" opacity="0.3" filter="url(#glow)"/>
</svg>